<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE185D"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="18" stroke="#CBD5E1" stroke-width="8"/></pattern></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#BE185D"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Four states (Week 10 grid) + indeterminate</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#BE185D"/><rect x="350" y="120" width="590" height="100" rx="12" fill="#1F2937" stroke="none" stroke-width="0"/><text x="645" y="163" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Both see where they stand</text><text x="645" y="201" font-size="28" font-weight="400" fill="#E5E7EB" text-anchor="middle">both sides read correctly</text><rect x="950" y="120" width="590" height="100" rx="12" fill="#1F2937" stroke="none" stroke-width="0"/><text x="1245" y="163" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">One or both misread it</text><text x="1245" y="201" font-size="28" font-weight="400" fill="#E5E7EB" text-anchor="middle">at least one reads wrongly</text><rect x="60" y="230" width="280" height="230" rx="16" fill="#F3F4F6" stroke="none" stroke-width="3"/><text x="200" y="330" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">They agree</text><text x="200" y="375" font-size="30" font-weight="400" fill="#4B5563" text-anchor="middle">AGR ≤ c</text><rect x="60" y="470" width="280" height="230" rx="16" fill="#F3F4F6" stroke="none" stroke-width="3"/><text x="200" y="570" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">They disagree</text><text x="200" y="615" font-size="30" font-weight="400" fill="#4B5563" text-anchor="middle">AGR &gt; c</text><rect x="350" y="230" width="590" height="230" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="4"/><text x="645" y="282" font-size="38" font-weight="700" fill="#16A34A" text-anchor="middle">Consensus</text><text x="645" y="326" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">they agree, and both see</text><text x="645" y="362" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">that they agree</text><text x="645" y="404" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">→ freeze the item</text><text x="645" y="442" font-size="28" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">group: monolithic consensus</text><rect x="950" y="230" width="590" height="230" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="4"/><text x="1245" y="282" font-size="38" font-weight="700" fill="#D97706" text-anchor="middle">False conflict</text><text x="1245" y="326" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">they agree, but one or both</text><text x="1245" y="362" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">think they disagree</text><text x="1245" y="404" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">→ show both views</text><text x="1245" y="442" font-size="28" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">group: pluralistic ignorance</text><rect x="350" y="470" width="590" height="230" rx="16" fill="#F3F4F6" stroke="#64748B" stroke-width="4"/><text x="645" y="522" font-size="38" font-weight="700" fill="#64748B" text-anchor="middle">Dissensus</text><text x="645" y="566" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">they disagree, and both</text><text x="645" y="602" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">see it: gap in the open</text><text x="645" y="644" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">→ ask for evidence</text><text x="645" y="682" font-size="28" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">group: dissensus</text><rect x="950" y="470" width="590" height="230" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="4"/><text x="1245" y="522" font-size="38" font-weight="700" fill="#DC2626" text-anchor="middle">False consensus</text><text x="1245" y="566" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">they disagree, but one or</text><text x="1245" y="602" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">both think they agree</text><text x="1245" y="644" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">→ check the key (costliest)</text><text x="1245" y="682" font-size="28" font-weight="400" fill="#6B7280" text-anchor="middle" font-style="italic">group: false consensus</text><rect x="60" y="720" width="730" height="150" rx="16" fill="url(#hatch)" stroke="#64748B" stroke-width="3"/><text x="425" y="770" font-size="34" font-weight="700" fill="#334155" text-anchor="middle">Indeterminate</text><text x="425" y="810" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">congruency and accuracy point different ways:</text><text x="425" y="848" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">never forced into a state</text><rect x="810" y="720" width="730" height="150" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="3"/><text x="1175" y="770" font-size="34" font-weight="700" fill="#166534" text-anchor="middle">Shared error (outside the grid)</text><text x="1175" y="810" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">they agree, and the answer key</text><text x="1175" y="848" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">says both are wrong</text></svg>