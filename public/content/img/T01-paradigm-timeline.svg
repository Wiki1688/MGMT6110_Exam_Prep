<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#2563EB"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Three paradigms, one mechanism underneath</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#2563EB"/><rect x="110" y="150" width="380" height="120" rx="18" fill="#E2EAFC" stroke="#2563EB" stroke-width="3"/><text x="300.0" y="197.78" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Predictive</text><text x="300.0" y="235.78" font-size="30" fill="#4B5563" text-anchor="middle">1940s–2015</text><rect x="500" y="150" width="380" height="120" rx="18" fill="#E2EAFC" stroke="#2563EB" stroke-width="3"/><text x="690.0" y="197.78" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Generative</text><text x="690.0" y="235.78" font-size="30" fill="#4B5563" text-anchor="middle">2015–2022</text><rect x="890" y="150" width="380" height="120" rx="18" fill="#E2EAFC" stroke="#2563EB" stroke-width="3"/><text x="1080.0" y="197.78" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Agentic</text><text x="1080.0" y="235.78" font-size="30" fill="#4B5563" text-anchor="middle">2022–present</text><rect x="1290" y="150" width="250" height="120" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-dasharray="10 8"/><text x="1415.0" y="218.96" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Physical AI</text><line x1="490" y1="210" x2="498" y2="210" stroke="#2563EB" stroke-width="5" marker-end="url(#ah0)"/><line x1="880" y1="210" x2="888" y2="210" stroke="#2563EB" stroke-width