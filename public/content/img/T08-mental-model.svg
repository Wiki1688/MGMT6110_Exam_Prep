<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA8A04"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#DC2626"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The night-shift temp: J-T-T-M-S + wall + record</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#DC2626"/><rect x="40" y="130" width="520" height="62" rx="31.0" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="300.0" y="171.5" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">BEFORE you leave</text><rect x="600" y="130" width="440" height="62" rx="31.0" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="820.0" y="171.5" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">WHILE you are away</text><rect x="1080" y="130" width="480" height="62" rx="31.0" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="1320.0" y="171.5" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">AFTER you return</text><rect x="40" y="210" width="80" height="88" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="80" y="270" font-size="44" font-weight="700" fill="#DC2626" text-anchor="middle">J</text><rect x="135" y="210" width="425" height="88" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="158" y="250" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Job in words</text><text x="158" y="286" font-size="28" fill="#4B5563" text-anchor="start">the job sheet</text><rect x="40" y="314" width="80" height="88" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="80" y="374" font-size="44" font-weight="700" fill="#DC2626" text-anchor="middle">T</text><rect x="135" y="314" width="425" height="88" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="158" y="354" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Trigger</text><text x="158" y="390" font-size="28" fill="#4B5563" text-anchor="start">the alarm clock</text><rect x="40" y="418" width="80" height="88" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="80" y="478" font-size="44" font-weight="700" fill="#DC2626" text-anchor="middle">T</text><rect x="135" y="418" width="425" height="88" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="158" y="458" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Tools</text><text x="158" y="494" font-size="28" fill="#4B5563" text-anchor="start">keys to two rooms</text><rect x="40" y="522" width="80" height="88" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="80" y="582" font-size="44" font-weight="700" fill="#DC2626" text-anchor="middle">M</text><rect x="135" y="522" width="425" height="88" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="158" y="562" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Memory</text><text x="158" y="598" font-size="28" fill="#4B5563" text-anchor="start">last night's notebook</text><rect x="40" y="626" width="80" height="88" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="80" y="686" font-size="44" font-weight="700" fill="#DC2626" text-anchor="middle">S</text><rect x="135" y="626" width="425" height="88" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="158" y="666" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Stop rule</text><text x="158" y="702" font-size="28" fill="#4B5563" text-anchor="start">home when done</text><rect x="40" y="745" width="520" height="110" rx="18" fill="#F3F4F6" stroke="#1F2937" stroke-width="3" stroke-dasharray="12 8"/><text x="300" y="790" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">WALL = the locked safe</text><text x="300" y="830" font-size="28" fill="#4B5563" text-anchor="middle">a boundary that refuses</text><ellipse cx="820" cy="430" rx="150" ry="130" fill="none" stroke="#DC2626" stroke-width="5"/><rect x="730" y="395" width="180" height="70" rx="35" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="820" y="442" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">MODEL</text><text x="820" y="285" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">observe</text><text x="1025" y="440" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">decide</text><text x="820" y="600" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">act</text><text x="610" y="440" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">check</text><rect x="640" y="650" width="360" height="110" rx="18" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="820.0" y="692.3199999999999" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">Trigger fires</text><text x="820.0" y="728.3199999999999" font-size="28" fill="#4B5563" text-anchor="middle">the alarm wakes it</text><line x1="700" y1="646" x2="712" y2="525" stroke="#CA8A04" stroke-width="4" marker-end="url(#ah0)"/><text x="820" y="810.0" font-size="28" fill="#4B5563" text-anchor="middle">'round again until STOP'</text><rect x="1080" y="210" width="480" height="190" rx="18" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="1320.0" y="292.88000000000005" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Read the RECORD first</text><text x="1320.0" y="328.88000000000005" font-size="28" fill="#4B5563" text-anchor="middle">the logbook, before the drafts</text><text x="1100" y="450.0" font-size="30" font-style="italic" fill="#1F2937" text-anchor="start">'A nice draft can come from a</text><text x="1100" y="486.6" font-size="30" font-style="italic" fill="#1F2937" text-anchor="start">temp who went into the wrong</text><text x="1100" y="523.2" font-size="30" font-style="italic" fill="#1F2937" text-anchor="start">room.'</text><rect x="1080" y="640" width="480" height="215" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1105" y="690.0" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">'GREEN means the machines</text><text x="1105" y="726.6" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">held, NOT that the job was</text><text x="1105" y="763.2" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">done.'</text></svg>