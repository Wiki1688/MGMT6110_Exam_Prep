<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE185D"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="18" stroke="#CBD5E1" stroke-width="8"/></pattern></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#BE185D"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Three measures from one item: E, F, G</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#BE185D"/><rect x="250" y="135" width="460" height="100" rx="16" fill="#FCE7F3" stroke="#BE185D" stroke-width="4"/><text x="480" y="180" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">X = one item</text><text x="480" y="218" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">finding F7: how severe, 0 to 4?</text><circle cx="170" cy="420" r="62" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/><text x="170" y="432" font-size="36" font-weight="700" fill="#1D4ED8" text-anchor="middle">A</text><circle cx="790" cy="420" r="62" fill="#EDE9FE" stroke="#7C3AED" stroke-width="5"/><text x="790" y="432" font-size="36" font-weight="700" fill="#6D28D9" text-anchor="middle">B</text><line x1="215" y1="375" x2="330" y2="240" stroke="#2563EB" stroke-width="4" marker-end="url(#m0)"/><line x1="745" y1="375" x2="630" y2="240" stroke="#7C3AED" stroke-width="4" marker-end="url(#m0)"/><line x1="236" y1="420" x2="724" y2="420" stroke="#9CA3AF" stroke-width="4"/><text x="480" y="408" font-size="28" font-weight="400" fill="#4B5563" text-anchor="middle">attraction</text><text x="480" y="458" font-size="28" font-weight="400" fill="#4B5563" text-anchor="middle">(trust, when B is an agent)</text><rect x="50" y="530" width="340" height="230" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/><text x="72" y="590" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">E · A’s own view</text><text x="365" y="590" font-size="34" font-weight="700" fill="#1D4ED8" text-anchor="end">4</text><text x="72" y="700" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">F · A’s estimate</text><text x="72" y="736" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">of B’s view</text><text x="365" y="700" font-size="34" font-weight="700" fill="#1D4ED8" text-anchor="end">4</text><rect x="600" y="530" width="320" height="110" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/><text x="620" y="595" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">G · B’s own view</text><text x="898" y="595" font-size="34" font-weight="700" fill="#6D28D9" text-anchor="end">2</text><line x1="390" y1="582" x2="600" y2="582" stroke="#BE185D" stroke-width="5"/><text x="495" y="566" font-size="28" font-weight="700" fill="#BE185D" text-anchor="middle">agreement</text><line x1="390" y1="712" x2="600" y2="622" stroke="#0F766E" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#m3)"/><text x="505" y="730" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start">accuracy</text><path d="M44,582 L26,582 L26,712 L44,712" fill="none" stroke="#B45309" stroke-width="5"/><text x="26" y="800" font-size="28" font-weight="700" fill="#B45309" text-anchor="start">congruency (inside A)</text><rect x="960" y="135" width="590" height="190" rx="16" fill="#FFFFFF" stroke="#BE185D" stroke-width="4"/><rect x="960" y="135" width="14" height="190" rx="4" fill="#BE185D" stroke="none" stroke-width="0"/><text x="995" y="187" font-size="34" font-weight="700" fill="#BE185D" text-anchor="start">Agreement = |E − G|</text><text x="995" y="239" font-size="30" font-weight="600" fill="#1F2937" text-anchor="start">|4 − 2| = 2 → they differ</text><text x="995" y="287" font-size="28" font-weight="400" fill="#4B5563" text-anchor="start">my view vs your view · one per pair</text><rect x="960" y="345" width="590" height="190" rx="16" fill="#FFFFFF" stroke="#B45309" stroke-width="4"/><rect x="960" y="345" width="14" height="190" rx="4" fill="#B45309" stroke="none" stroke-width="0"/><text x="995" y="397" font-size="34" font-weight="700" fill="#B45309" text-anchor="start">Congruency = |E − F|</text><text x="995" y="449" font-size="30" font-weight="600" fill="#1F2937" text-anchor="start">|4 − 4| = 0 → A expects agreement</text><text x="995" y="497" font-size="28" font-weight="400" fill="#4B5563" text-anchor="start">my view vs my guess · inside one side</text><rect x="960" y="555" width="590" height="190" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/><rect x="960" y="555" width="14" height="190" rx="4" fill="#0F766E" stroke="none" stroke-width="0"/><text x="995" y="607" font-size="34" font-weight="700" fill="#0F766E" text-anchor="start">Accuracy = |F − G|</text><text x="995" y="659" font-size="30" font-weight="600" fill="#1F2937" text-anchor="start">|4 − 2| = 2 → A misreads B</text><text x="995" y="707" font-size="28" font-weight="400" fill="#4B5563" text-anchor="start">my guess vs your real view · one way</text><text x="60" y="862" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">Cut-off c = 1.0: a gap of 1.0 or less counts as a match (ties included). Here: hidden gap = false consensus.</text></svg>