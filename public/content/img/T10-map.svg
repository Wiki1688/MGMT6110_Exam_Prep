<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#9333EA"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The Map: who should lead?</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#9333EA"/><rect x="330" y="125" width="600" height="62" rx="31.0" fill="#1E293B" stroke="#1E293B" stroke-width="0"/><text x="630.0" y="165.8" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Work with a right answer</text><rect x="940" y="125" width="600" height="62" rx="31.0" fill="#1E293B" stroke="#1E293B" stroke-width="0"/><text x="1240.0" y="165.8" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Work with no single right answer</text><rect x="40" y="200" width="270" height="300" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="175.0" y="330.0" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">People and AI</text><text x="175.0" y="364.15999999999997" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">must do it</text><text x="175.0" y="398.32" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">together</text><rect x="40" y="510" width="270" height="300" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="175.0" y="640.0" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">Either can do it</text><text x="175.0" y="674.16" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">alone</text><rect x="330" y="200" width="600" height="300" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="350" y="242" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">A person leads, AI inside</text><ellipse cx="630" cy="380" rx="230" ry="95" fill="#F1EBFD" stroke="#7C3AED" stroke-width="5"/><text x="630" y="325" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">person</text><ellipse cx="630" cy="400" rx="100" ry="45" fill="#E9EFFD" stroke="#2563EB" stroke-width="5"/><text x="630" y="410" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">AI</text><rect x="940" y="200" width="600" height="300" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="960" y="242" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">AI agents run it, a person judges</text><ellipse cx="1240" cy="380" rx="230" ry="95" fill="#E9EFFD" stroke="#2563EB" stroke-width="5"/><text x="1240" y="325" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">AI agents</text><ellipse cx="1240" cy="400" rx="100" ry="45" fill="#F1EBFD" stroke="#7C3AED" stroke-width="5"/><text x="1240" y="410" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">person</text><rect x="330" y="510" width="600" height="300" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="350" y="552" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">AI alone</text><ellipse cx="630" cy="690" rx="150" ry="75" fill="#E9EFFD" stroke="#2563EB" stroke-width="5"/><text x="630" y="700" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">AI</text><rect x="940" y="510" width="600" height="300" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/><text x="960" y="552" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">A person + AI, side by side</text><ellipse cx="1170" cy="690" rx="135" ry="75" fill="#F1EBFD" stroke="#7C3AED" stroke-width="5"/><ellipse cx="1320" cy="690" rx="135" ry="75" fill="#E9EFFD" stroke="#2563EB" stroke-width="5"/><ellipse cx="1170" cy="690" rx="135" ry="75" fill="none" stroke="#7C3AED" stroke-width="5"/><text x="1115" y="700" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="middle">person</text><text x="1380" y="700" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">+ AI</text><text x="800" y="870" font-size="28" fill="#4B5563" text-anchor="middle">purple = person · blue = AI · place ONE task, not a whole job</text></svg>