<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#7C3AED"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">OpenAI's 3-step fix: GPT-3 → InstructGPT</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#7C3AED"/><rect x="70" y="140" width="460" height="70" rx="35.0" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/><text x="300.0" y="186.2" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Step 1 · SFT</text><rect x="70" y="240" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="300.0" y="315.59999999999997" font-size="30" fill="#1F2937" text-anchor="middle">A prompt is sampled</text><line x1="300" y1="378" x2="300" y2="412" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="70" y="415" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="300.0" y="472.29999999999995" font-size="30" fill="#1F2937" text-anchor="middle">A labeller writes the ideal</text><text x="300.0" y="508.9" font-size="30" fill="#1F2937" text-anchor="middle">answer</text><line x1="300" y1="553" x2="300" y2="587" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="70" y="590" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="300.0" y="665.6" font-size="30" fill="#1F2937" text-anchor="middle">Fine-tune the model</text><line x1="535" y1="175" x2="570" y2="175" stroke="#7C3AED" stroke-width="5" marker-end="url(#ah0)"/><rect x="575" y="140" width="460" height="70" rx="35.0" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/><text x="805.0" y="186.2" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Step 2 · Reward model</text><rect x="575" y="240" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="805.0" y="297.29999999999995" font-size="30" fill="#1F2937" text-anchor="middle">One prompt → answers A, B,</text><text x="805.0" y="333.9" font-size="30" fill="#1F2937" text-anchor="middle">C, D</text><line x1="805" y1="378" x2="805" y2="412" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="575" y="415" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="805.0" y="490.59999999999997" font-size="30" fill="#1F2937" text-anchor="middle">Labeller ranks: D &gt; C &gt; A = B</text><line x1="805" y1="553" x2="805" y2="587" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="575" y="590" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="805.0" y="665.6" font-size="30" fill="#1F2937" text-anchor="middle">Train the reward model</text><line x1="1040" y1="175" x2="1075" y2="175" stroke="#7C3AED" stroke-width="5" marker-end="url(#ah0)"/><rect x="1080" y="140" width="460" height="70" rx="35.0" fill="#7C3AED" stroke="#7C3AED" stroke-width="0"/><text x="1310.0" y="186.2" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Step 3 · PPO</text><rect x="1080" y="240" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="1310.0" y="315.59999999999997" font-size="30" fill="#1F2937" text-anchor="middle">New prompt → policy answers</text><line x1="1310" y1="378" x2="1310" y2="412" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="1080" y="415" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="1310.0" y="490.59999999999997" font-size="30" fill="#1F2937" text-anchor="middle">Reward model scores it (r)</text><line x1="1310" y1="553" x2="1310" y2="587" stroke="#7C3AED" stroke-width="4" marker-end="url(#ah0)"/><rect x="1080" y="590" width="460" height="135" rx="18" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="1310.0" y="665.6" font-size="30" fill="#1F2937" text-anchor="middle">PPO updates the policy</text><text x="800" y="840" font-size="32" font-weight="700" fill="#7C3AED" text-anchor="middle">Human preferences teach GPT-3 to follow instructions.</text></svg>