<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#DC2626"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Four levels: who is exposed if it is wrong?</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#DC2626"/><rect x="60" y="640" width="350" height="160" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="3"/><text x="84" y="692" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Read</text><text x="84" y="738.0" font-size="28" fill="#4B5563" text-anchor="start">you, and only your</text><text x="84" y="772.16" font-size="28" fill="#4B5563" text-anchor="start">time</text><rect x="430" y="500" width="350" height="300" rx="18" fill="#DBEAFE" stroke="#9CA3AF" stroke-width="3"/><text x="454" y="552" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Draft</text><text x="454" y="598.0" font-size="28" fill="#4B5563" text-anchor="start">nobody outside — YOU</text><text x="454" y="632.16" font-size="28" fill="#4B5563" text-anchor="start">send</text><rect x="800" y="360" width="350" height="440" rx="18" fill="#FEF3C7" stroke="#9CA3AF" stroke-width="3"/><text x="824" y="412" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Act with approval</text><text x="824" y="458.0" font-size="28" fill="#4B5563" text-anchor="start">you + recipient, once</text><text x="824" y="492.15999999999997" font-size="28" fill="#4B5563" text-anchor="start">you click</text><rect x="1170" y="220" width="350" height="580" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1194" y="272" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Act alone</text><text x="1194" y="318.0" font-size="28" fill="#4B5563" text-anchor="start">recipient, your firm,</text><text x="1194" y="352.15999999999997" font-size="28" fill="#4B5563" text-anchor="start">you after</text><line x1="70" y1="180" x2="900" y2="180" stroke="#DC2626" stroke-width="5" marker-end="url(#ah0)"/><text x="80" y="160" font-size="30" font-weight="700" fill="#DC2626" text-anchor="start">more authority, more people exposed</text><text x="60" y="270.0" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">Ask 'if this goes wrong, who gets hurt?'</text><text x="60" y="306.6" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">not 'how clever is the model?'</text></svg>