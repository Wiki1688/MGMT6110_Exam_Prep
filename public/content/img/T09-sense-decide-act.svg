<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#DB2777"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The classic agent: Sense → Decide → Act</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#DB2777"/><rect x="80" y="140" width="1440" height="380" rx="18" fill="#FCEFF5" stroke="#DB2777" stroke-width="3"/><text x="110" y="190" font-size="30" font-weight="700" fill="#DB2777" text-anchor="start">THE AGENT</text><rect x="150" y="230" width="380" height="220" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="340.0" y="313.04" font-size="40" font-weight="700" fill="#1F2937" text-anchor="middle">Sense</text><text x="340.0" y="349.04" font-size="28" fill="#4B5563" text-anchor="middle">sensors: a payment, an</text><text x="340.0" y="383.20000000000005" font-size="28" fill="#4B5563" text-anchor="middle">email</text><line x1="535" y1="340" x2="605" y2="340" stroke="#DB2777" stroke-width="5" marker-end="url(#ah0)"/><rect x="610" y="230" width="380" height="220" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="800.0" y="313.04" font-size="40" font-weight="700" fill="#1F2937" text-anchor="middle">Decide</text><text x="800.0" y="349.04" font-size="28" fill="#4B5563" text-anchor="middle">the program: a rule a</text><text x="800.0" y="383.20000000000005" font-size="28" fill="#4B5563" text-anchor="middle">person wrote</text><line x1="995" y1="340" x2="1065" y2="340" stroke="#DB2777" stroke-width="5" marker-end="url(#ah0)"/><rect x="1070" y="230" width="380" height="220" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="1260.0" y="313.04" font-size="40" font-weight="700" fill="#1F2937" text-anchor="middle">Act</text><text x="1260.0" y="349.04" font-size="28" fill="#4B5563" text-anchor="middle">actuators: hold a</text><text x="1260.0" y="383.20000000000005" font-size="28" fill="#4B5563" text-anchor="middle">payment</text><rect x="80" y="650" width="1440" height="100" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="800" y="712" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Environment: the bank's card network</text><line x1="340" y1="645" x2="340" y2="455" stroke="#4B5563" stroke-width="4" marker-end="url(#ah1)"/><text x="250.0" y="550.0" font-size="28" fill="#4B5563" text-anchor="middle">percepts</text><line x1="1260" y1="455" x2="1260" y2="645" stroke="#4B5563" stroke-width="4" marker-end="url(#ah1)"/><text x="1340.0" y="550.0" font-size="28" fill="#4B5563" text-anchor="middle">actions</text><text x="800" y="600" font-size="32" font-weight="700" fill="#DB2777" text-anchor="middle">'A language model is one way to fill the Decide box.'</text><text x="800" y="820" font-size="30" fill="#1F2937" text-anchor="middle">Card 4417: London 09:03, Singapore 09:12 → hold it and text the customer.</text></svg>