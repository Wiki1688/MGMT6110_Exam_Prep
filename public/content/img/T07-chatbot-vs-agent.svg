<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#EA580C"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">A chatbot answers. An agent keeps going.</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#EA580C"/><rect x="40" y="140" width="600" height="560" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="340" y="200" font-size="38" font-weight="700" fill="#1F2937" text-anchor="middle">Chatbot</text><rect x="80" y="260" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/><text x="180.0" y="323.96000000000004" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">User</text><rect x="400" y="260" width="200" height="110" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><text x="500.0" y="323.96000000000004" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">LLM</text><line x1="285" y1="290" x2="395" y2="290" stroke="#4B5563" stroke-width="4" marker-end="url(#ah0)"/><text x="340.0" y="276.0" font-size="28" fill="#4B5563" text-anchor="middle">question</text><line x1="395" y1="345" x2="285" y2="345" stroke="#4B5563" stroke-width="4" marker-end="url(#ah0)"/><text x="340.0" y="389.0" font-size="28" fill="#4B5563" text-anchor="middle">answer</text><text x="340" y="500.0" font-size="30" fill="#1F2937" text-anchor="middle">One question, one answer. No tools</text><text x="340" y="536.6" font-size="30" fill="#1F2937" text-anchor="middle">needed.</text><rect x="680" y="140" width="880" height="560" rx="18" fill="#FDF3ED" stroke="#EA580C" stroke-width="3"/><text x="1120" y="200" font-size="38" font-weight="700" fill="#EA580C" text-anchor="middle">Agent</text><rect x="970" y="220" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="1120.0" y="260.48" font-size="28" fill="#1F2937" text-anchor="middle">Model writes a</text><text x="1120.0" y="294.64" font-size="28" fill="#1F2937" text-anchor="middle">request</text><rect x="1250" y="380" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="1400.0" y="437.56" font-size="28" fill="#1F2937" text-anchor="middle">Harness checks it</text><rect x="970" y="550" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="1120.0" y="607.56" font-size="28" fill="#1F2937" text-anchor="middle">Tool runs</text><rect x="690" y="380" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="840.0" y="420.48" font-size="28" fill="#1F2937" text-anchor="middle">Result joins the</text><text x="840.0" y="454.64" font-size="28" fill="#1F2937" text-anchor="middle">record</text><path d="M1270,290 Q1400,300 1400,378" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#ah1)"/><path d="M1400,482 Q1400,600 1272,600" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#ah1)"/><path d="M968,600 Q840,600 840,482" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#ah1)"/><path d="M840,378 Q840,290 968,280" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#ah1)"/><text x="1120" y="440" font-size="28" font-weight="700" fill="#EA580C" text-anchor="middle">until a stop rule</text><rect x="40" y="740" width="1520" height="110" rx="18" fill="#FCEAE1" stroke="#EA580C" stroke-width="3"/><text x="800" y="790" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Same model + a loop + a short list of tools + a stop rule.</text><text x="800" y="832" font-size="30" fill="#1F2937" text-anchor="middle">'That software is yours.'</text></svg>