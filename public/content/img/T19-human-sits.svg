<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="18" stroke="#CBD5E1" stroke-width="8"/></pattern></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#B45309"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">PS8: where the human sits when an agent runs alone</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#B45309"/><rect x="60" y="140" width="460" height="560" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="4"/><rect x="60" y="140" width="460" height="90" rx="16" fill="#2563EB" stroke="none" stroke-width="0"/><rect x="60" y="200" width="460" height="30" rx="0" fill="#2563EB" stroke="none" stroke-width="0"/><text x="290" y="200" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">BEFORE</text><text x="290" y="290" font-size="36" font-weight="700" fill="#2563EB" text-anchor="middle">The brief</text><text x="290" y="355" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">P1–P6 + budget + stop rules</text><text x="290" y="413" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">“book nothing, send nothing”</text><text x="290" y="471" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">one line you change</text><text x="290" y="529" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">(“preferably SIA” → S$6,563.80)</text><rect x="90" y="600" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><text x="290" y="646" font-size="30" font-weight="700" fill="#2563EB" text-anchor="middle">Words: they only ASK</text><rect x="570" y="140" width="460" height="560" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="4"/><rect x="570" y="140" width="460" height="90" rx="16" fill="#DC2626" stroke="none" stroke-width="0"/><rect x="570" y="200" width="460" height="30" rx="0" fill="#DC2626" stroke="none" stroke-width="0"/><text x="800" y="200" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">DURING</text><text x="800" y="290" font-size="36" font-weight="700" fill="#DC2626" text-anchor="middle">The gate</text><text x="800" y="355" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">Sentinel: a program</text><text x="800" y="413" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">outside the agent</text><text x="800" y="471" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">Approval required box</text><text x="800" y="529" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">your Deny held at 6:41 pm</text><rect x="600" y="600" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><text x="800" y="646" font-size="30" font-weight="700" fill="#DC2626" text-anchor="middle">Setting: it ENFORCES</text><rect x="1080" y="140" width="460" height="560" rx="16" fill="#F0FDF4" stroke="#15803D" stroke-width="4"/><rect x="1080" y="140" width="460" height="90" rx="16" fill="#15803D" stroke="none" stroke-width="0"/><rect x="1080" y="200" width="460" height="30" rx="0" fill="#15803D" stroke="none" stroke-width="0"/><text x="1310" y="200" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">AFTER</text><text x="1310" y="290" font-size="36" font-weight="700" fill="#15803D" text-anchor="middle">Record + checks</text><text x="1310" y="355" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">Activity tab, Approvals</text><text x="1310" y="413" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">3 live prices (you)</text><text x="1310" y="471" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">Claude’s check (1 of 3 agreed)</text><text x="1310" y="529" font-size="28" font-weight="400" fill="#1F2937" text-anchor="middle">the live page decides</text><rect x="1110" y="600" width="400" height="70" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="3"/><text x="1310" y="646" font-size="30" font-weight="700" fill="#15803D" text-anchor="middle">Evidence: it PROVES</text><line x1="525" y1="420" x2="563" y2="420" stroke="#374151" stroke-width="6" marker-end="url(#m0)"/><line x1="1035" y1="420" x2="1073" y2="420" stroke="#374151" stroke-width="6" marker-end="url(#m0)"/><rect x="60" y="730" width="1480" height="130" rx="16" fill="#1F2937" stroke="none" stroke-width="0"/><text x="800" y="790" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">Brief asks. Gate enforces. Record proves. Checks verify.</text><text x="800" y="836" font-size="28" font-weight="400" fill="#FDE68A" text-anchor="middle">Gate missed at 3:01 pm, held at 6:41 pm under the same setting: test the gate.</text></svg>