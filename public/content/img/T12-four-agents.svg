<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#0EA5E9"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Group 4: four PS5 agents, one per quadrant</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#0EA5E9"/><rect x="330" y="125" width="600" height="62" rx="31.0" fill="#1E293B" stroke="#1E293B" stroke-width="0"/><text x="630.0" y="165.8" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Right answer (Q1 yes)</text><rect x="940" y="125" width="600" height="62" rx="31.0" fill="#1E293B" stroke="#1E293B" stroke-width="0"/><text x="1240.0" y="165.8" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">No single right answer (Q1 no)</text><rect x="40" y="200" width="270" height="300" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="175.0" y="330.0" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">Must do</text><text x="175.0" y="364.15999999999997" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">together (Q2</text><text x="175.0" y="398.32" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">yes)</text><rect x="40" y="510" width="270" height="300" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="175.0" y="640.0" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">Either alone (Q2</text><text x="175.0" y="674.16" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">no)</text><rect x="330" y="200" width="600" height="300" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="352" y="246" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Expense Claim Pre-Check</text><text x="352" y="295.0" font-size="28" fill="#4B5563" text-anchor="start">fixed policy rules → email to manager</text><rect x="352" y="408" width="556" height="70" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="372" y="453" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="start">Person: manager signs off</text><rect x="940" y="200" width="600" height="300" rx="10" fill="#E9EFFD" stroke="#2563EB" stroke-width="3"/><text x="962" y="246" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Banking CRM Onboarding</text><text x="962" y="295.0" font-size="28" fill="#4B5563" text-anchor="start">Gemini drafts → Human in the Loop →</text><text x="962" y="329.15999999999997" font-size="28" fill="#4B5563" text-anchor="start">Gmail</text><rect x="962" y="408" width="556" height="70" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="982" y="453" font-size="28" font-weight="700" fill="#2563EB" text-anchor="start">Person: approves, then it continues</text><rect x="330" y="510" width="600" height="300" rx="10" fill="#E9EFFD" stroke="#2563EB" stroke-width="3"/><text x="352" y="556" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Daily Manpower Report</text><text x="352" y="605.0" font-size="28" fill="#4B5563" text-anchor="start">Sheets row → Gmail to HR, weekdays</text><rect x="352" y="718" width="556" height="70" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="372" y="763" font-size="28" font-weight="700" fill="#2563EB" text-anchor="start">Person: HR spot-checks Fridays</text><rect x="940" y="510" width="600" height="300" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="3"/><text x="962" y="556" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">MBairline Feedback</text><text x="962" y="605.0" font-size="28" fill="#4B5563" text-anchor="start">AI → Gmail CREATE DRAFT, not Send</text><rect x="962" y="718" width="556" height="70" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="982" y="763" font-size="28" font-weight="700" fill="#7C3AED" text-anchor="start">Person: decides on the case</text><text x="800" y="870" font-size="28" font-weight="700" fill="#DC2626" text-anchor="middle">'Removing an approval does not by itself move an agent: the work has to change.'</text></svg>