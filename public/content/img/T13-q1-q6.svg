<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#16A34A"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Q1–Q6: read any product from its settings</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#16A34A"/><rect x="60" y="135" width="110" height="85" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="115" y="192" font-size="36" font-weight="700" fill="#DC2626" text-anchor="middle">Q1</text><rect x="190" y="135" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="191" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Who starts a run?</text><rect x="930" y="135" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="190" font-size="30" fill="#4B5563" text-anchor="middle">trigger</text><rect x="60" y="238" width="110" height="85" rx="14" fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/><text x="115" y="295" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Q2</text><rect x="190" y="238" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="294" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">How long on its own?</text><rect x="930" y="238" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="293" font-size="30" fill="#4B5563" text-anchor="middle">loop + stop rule</text><rect x="60" y="341" width="110" height="85" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="115" y="398" font-size="36" font-weight="700" fill="#DC2626" text-anchor="middle">Q3</text><rect x="190" y="341" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="397" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">What can it touch?</text><rect x="930" y="341" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="396" font-size="30" fill="#4B5563" text-anchor="middle">permissions</text><rect x="60" y="444" width="110" height="85" rx="14" fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/><text x="115" y="501" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Q4</text><rect x="190" y="444" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="500" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">What does it remember?</text><rect x="930" y="444" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="499" font-size="30" fill="#4B5563" text-anchor="middle">memory</text><rect x="60" y="547" width="110" height="85" rx="14" fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/><text x="115" y="604" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Q5</text><rect x="190" y="547" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="603" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Where does a person approve?</text><rect x="930" y="547" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="602" font-size="30" fill="#4B5563" text-anchor="middle">human gate</text><rect x="60" y="650" width="110" height="85" rx="14" fill="#F3F4F6" stroke="#1F2937" stroke-width="3"/><text x="115" y="707" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Q6</text><rect x="190" y="650" width="720" height="85" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="215" y="706" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Where does it run / data go?</text><rect x="930" y="650" width="330" height="85" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1095" y="705" font-size="30" fill="#4B5563" text-anchor="middle">the place</text><rect x="1290" y="135" width="270" height="290" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/><text x="1425" y="195.0" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">Q1 + Q3 draw</text><text x="1425" y="231.6" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">the territory</text><text x="1425" y="268.2" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">map</text><rect x="1290" y="450" width="270" height="290" rx="18" fill="#E3F3E9" stroke="#16A34A" stroke-width="3"/><text x="1425" y="515.0" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">Q2 = dot size</text><text x="1425" y="551.6" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">on the map</text><text x="800" y="820" font-size="32" font-weight="700" fill="#16A34A" text-anchor="middle">Starts · Stays · Touches · Remembers · Approves · Runs</text><text x="800" y="865" font-size="28" fill="#4B5563" text-anchor="middle">less on its own, less reach  →  more on its own, more reach</text></svg>