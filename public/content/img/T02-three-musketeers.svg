<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#7C3AED"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The Three Musketeers of reasoning</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#7C3AED"/><rect x="70" y="150" width="460" height="560" rx="18" fill="#F4EFFD" stroke="#7C3AED" stroke-width="3"/><rect x="70" y="150" width="460" height="100" rx="18" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/><text x="300" y="215" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">Prompting</text><text x="300" y="330" font-size="80" font-weight="700" fill="#7C3AED" text-anchor="middle">1</text><text x="300" y="420.0" font-size="32" fill="#1F2937" text-anchor="middle">Use Chain of Thought in</text><text x="300" y="459.04" font-size="32" fill="#1F2937" text-anchor="middle">the prompt</text><rect x="100" y="610" width="400" height="70" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="300" y="655" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">No weight change</text><rect x="575" y="150" width="460" height="560" rx="18" fill="#F4EFFD" stroke="#7C3AED" stroke-width="3"/><rect x="575" y="150" width="460" height="100" rx="18" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/><text x="805" y="215" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">Training</text><text x="805" y="330" font-size="80" font-weight="700" fill="#7C3AED" text-anchor="middle">2</text><text x="805" y="420.0" font-size="32" fill="#1F2937" text-anchor="middle">SFT on Q&amp;A with</text><text x="805" y="459.04" font-size="32" fill="#1F2937" text-anchor="middle">reasoning traces + RL</text><text x="805" y="498.08" font-size="32" fill="#1F2937" text-anchor="middle">with Verifiable Rewards</text><rect x="605" y="610" width="400" height="70" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="805" y="655" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">Changes the weights</text><rect x="1080" y="150" width="460" height="560" rx="18" fill="#F4EFFD" stroke="#7C3AED" stroke-width="3"/><rect x="1080" y="150" width="460" height="100" rx="18" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/><text x="1310" y="215" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">After Training</text><text x="1310" y="330" font-size="80" font-weight="700" fill="#7C3AED" text-anchor="middle">3</text><text x="1310" y="420.0" font-size="32" fill="#1F2937" text-anchor="middle">Give the LLM more time</text><text x="1310" y="459.04" font-size="32" fill="#1F2937" text-anchor="middle">to think</text><rect x="1110" y="610" width="400" height="70" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="1310" y="655" font-size="28" font-weight="700" fill="#1F2937" text-anchor="middle">No retraining</text><text x="800" y="800" font-size="32" font-weight="700" fill="#DC2626" text-anchor="middle">Not the same list as SFT → Reward model → PPO.</text></svg>