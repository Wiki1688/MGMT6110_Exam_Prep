<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#0D9488"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">Which way the request travels</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#0D9488"/><rect x="60" y="300" width="380" height="200" rx="18" fill="#DFF1EF" stroke="#0D9488" stroke-width="3"/><text x="250.0" y="387.88000000000005" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Your page</text><text x="250.0" y="423.88000000000005" font-size="28" fill="#4B5563" text-anchor="middle">in a visitor's browser</text><rect x="610" y="300" width="380" height="200" rx="18" fill="#DFF1EF" stroke="#0D9488" stroke-width="3"/><text x="800.0" y="387.88000000000005" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">/api/bus</text><text x="800.0" y="423.88000000000005" font-size="28" fill="#4B5563" text-anchor="middle">your function, on Vercel</text><rect x="1160" y="300" width="380" height="200" rx="18" fill="#F3F4F6" stroke="#4B5563" stroke-width="3"/><text x="1350.0" y="387.88000000000005" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">LTA DataMall</text><text x="1350.0" y="423.88000000000005" font-size="28" fill="#4B5563" text-anchor="middle">datamall2.mytransport.sg</text><rect x="640" y="520" width="320" height="60" rx="30.0" fill="#0D9488" stroke="#0D9488" stroke-width="0"/><text x="800.0" y="559.8" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">AccountKey lives here</text><line x1="445" y1="400" x2="604" y2="400" stroke="#16A34A" stroke-width="6" marker-end="url(#ah0)"/><text x="524.5" y="380.0" font-size="28" fill="#4B5563" text-anchor="middle">own address</text><line x1="995" y1="400" x2="1154" y2="400" stroke="#16A34A" stroke-width="6" marker-end="url(#ah0)"/><text x="1074.5" y="380.0" font-size="28" fill="#4B5563" text-anchor="middle">server call</text><path d="M250,295 C400,140 1200,140 1350,295" fill="none" stroke="#DC2626" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#ah1)"/><text x="800" y="175" font-size="30" font-weight="700" fill="#DC2626" text-anchor="middle">✕ blocked: straight from the browser (CORS, preflight)</text><rect x="60" y="680" width="1480" height="140" rx="18" fill="#E6F4F3" stroke="#0D9488" stroke-width="3"/><text x="800" y="740" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">'A credential on the server, a function in the middle,</text><text x="800" y="790" font-size="34" font-weight="700" fill="#1F2937" text-anchor="middle">a page that only ever talks to its own address.'</text></svg>