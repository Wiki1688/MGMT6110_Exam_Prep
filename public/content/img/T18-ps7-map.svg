<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="18" stroke="#CBD5E1" stroke-width="8"/></pattern></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#0F766E"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">PS7: one job, every region (same model, different harness)</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#0F766E"/><rect x="230" y="140" width="415.0" height="300.0" rx="0" fill="#FDF2F8" stroke="none" stroke-width="0"/><rect x="645.0" y="140" width="415.0" height="300.0" rx="0" fill="#FFFBEB" stroke="none" stroke-width="0"/><rect x="230" y="440.0" width="415.0" height="300.0" rx="0" fill="#EFF6FF" stroke="none" stroke-width="0"/><rect x="645.0" y="440.0" width="415.0" height="300.0" rx="0" fill="#ECFDF5" stroke="none" stroke-width="0"/><line x1="645.0" y1="140" x2="645.0" y2="740" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="10 8"/><line x1="230" y1="440.0" x2="1060" y2="440.0" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="10 8"/><line x1="230" y1="740" x2="1090" y2="740" stroke="#1F2937" stroke-width="5" marker-end="url(#m0)"/><line x1="230" y1="740" x2="230" y2="120" stroke="#1F2937" stroke-width="5" marker-end="url(#m0)"/><text x="250" y="182" font-size="34" font-weight="700" fill="#9D174D" text-anchor="start">Delegate</text><text x="665.0" y="182" font-size="34" font-weight="700" fill="#92400E" text-anchor="start">Autopilot</text><text x="250" y="482.0" font-size="34" font-weight="700" fill="#1D4ED8" text-anchor="start">Ask</text><text x="665.0" y="482.0" font-size="34" font-weight="700" fill="#166534" text-anchor="start">Monitor</text><text x="230" y="782" font-size="28" font-weight="400" fill="#374151" text-anchor="start">you, each time</text><text x="1060" y="782" font-size="28" font-weight="400" fill="#374151" text-anchor="end">a schedule</text><text x="645.0" y="826" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">Q1 (Who starts a run?)</text><text x="210" y="180" font-size="28" font-weight="400" fill="#374151" text-anchor="end">changes</text><text x="210" y="214" font-size="28" font-weight="400" fill="#374151" text-anchor="end">things</text><text x="210" y="690" font-size="28" font-weight="400" fill="#374151" text-anchor="end">only</text><text x="210" y="724" font-size="28" font-weight="400" fill="#374151" text-anchor="end">reads</text><text x="80" y="440.0" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle" transform="rotate(-90 80 440.0)">Q3 (What can it touch?)</text><circle cx="400" cy="600" r="34" fill="#2563EB" stroke="#FFFFFF" stroke-width="4"/><text x="400" y="611" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="330" cy="330" r="34" fill="#BE185D" stroke="#FFFFFF" stroke-width="4"/><text x="330" y="341" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="430" cy="250" r="34" fill="#BE185D" stroke="#FFFFFF" stroke-width="4"/><text x="430" y="261" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="530" cy="330" r="34" fill="#BE185D" stroke="#FFFFFF" stroke-width="4"/><text x="530" y="341" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="380" cy="410" r="34" fill="#BE185D" stroke="#FFFFFF" stroke-width="4"/><text x="380" y="421" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="560" cy="420" r="34" fill="#BE185D" stroke="#FFFFFF" stroke-width="4"/><text x="560" y="431" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><circle cx="860" cy="620" r="40" fill="#16A34A" stroke="#FFFFFF" stroke-width="4"/><text x="860" y="631" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">4a</text><circle cx="860" cy="330" r="40" fill="#B45309" stroke="#FFFFFF" stroke-width="4"/><text x="860" y="341" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">4b</text><line x1="860" y1="575" x2="860" y2="378" stroke="#0F766E" stroke-width="6" marker-end="url(#m3)"/><text x="838" y="540" font-size="28" font-weight="700" fill="#0F766E" text-anchor="end">file line +</text><text x="838" y="576" font-size="28" font-weight="700" fill="#0F766E" text-anchor="end">Accept edits</text><rect x="1110" y="140" width="440" height="600" rx="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/><text x="1134" y="192" font-size="30" font-weight="700" fill="#0F766E" text-anchor="start">Run → region</text><text x="1134" y="238" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">1 Chat → Ask</text><text x="1134" y="278" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">2 Chrome, 3 Cowork,</text><text x="1134" y="318" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">5 Code, 6 Excel,</text><text x="1134" y="358" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">7 my subagent → Delegate</text><text x="1134" y="398" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">4a watch → Monitor</text><text x="1134" y="438" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">4b writes file → Autopilot</text><text x="1134" y="498" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="start">Not the clock:</text><text x="1134" y="536" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">it started 4a and 4b.</text><text x="1134" y="586" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">Q3 is read from what it</text><text x="1134" y="624" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">COULD do (permissions).</text><text x="60" y="880" font-size="28" font-weight="600" fill="#1F2937" text-anchor="start">All 8 runs scored 7 of 7; the gate (a setting) differed, not the model.</text></svg>