<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#16A34A"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The ladder: who chooses the next step?</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#16A34A"/><rect x="60" y="740" width="80" height="95" rx="12" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="100" y="803" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="155" y="740" width="560" height="95" rx="12" fill="#E7F5EC" stroke="#16A34A" stroke-width="3"/><text x="178" y="800" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">A chat answer</text><text x="740" y="800" font-size="30" fill="#1F2937" text-anchor="start">→ you, every time</text><rect x="160" y="615" width="80" height="95" rx="12" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="200" y="678" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="255" y="615" width="560" height="95" rx="12" fill="#DEF2E5" stroke="#16A34A" stroke-width="3"/><text x="278" y="675" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">A fixed workflow (your Zap)</text><text x="840" y="675" font-size="30" fill="#1F2937" text-anchor="start">→ the flowchart you drew</text><rect x="260" y="490" width="80" height="95" rx="12" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="300" y="553" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="355" y="490" width="560" height="95" rx="12" fill="#D5EEDE" stroke="#16A34A" stroke-width="3"/><text x="378" y="550" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">An answer with web search</text><text x="940" y="550" font-size="30" fill="#16A34A" text-anchor="start">→ the model, a few searches</text><rect x="360" y="365" width="80" height="95" rx="12" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="400" y="428" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="455" y="365" width="560" height="95" rx="12" fill="#CBEAD7" stroke="#16A34A" stroke-width="3"/><text x="478" y="425" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">An agent (Claude Code)</text><text x="1040" y="425" font-size="30" fill="#16A34A" text-anchor="start">→ the model, every turn</text><rect x="460" y="240" width="80" height="95" rx="12" fill="#1F2937" stroke="#1F2937" stroke-width="0"/><text x="500" y="303" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="555" y="240" width="560" height="95" rx="12" fill="#C2E7CF" stroke="#16A34A" stroke-width="3"/><text x="578" y="300" font-size="30" font-weight="700" fill="#1F2937" text-anchor="start">An agent that starts itself</text><text x="1140" y="300" font-size="30" fill="#16A34A" text-anchor="start">→ the model, unwatched</text><line x1="1530" y1="820" x2="1530" y2="200" stroke="#16A34A" stroke-width="5" marker-end="url(#ah0)"/><text x="1560" y="150.0" font-size="28" font-weight="700" fill="#16A34A" text-anchor="end">fewer people</text><text x="1560" y="184.16" font-size="28" font-weight="700" fill="#16A34A" text-anchor="end">watching</text><text x="60" y="180" font-size="30" font-weight="700" fill="#4B5563" text-anchor="start">Each rung up: less chosen by a person, more by the model.</text></svg>