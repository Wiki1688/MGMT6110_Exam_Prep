<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#DB2777"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">ReAct: think, act, read the result</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#DB2777"/><rect x="350" y="145" width="380" height="170" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="540.0" y="219.0" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Thought</text><text x="540.0" y="255.0" font-size="28" fill="#4B5563" text-anchor="middle">words: what to do next</text><rect x="650" y="515" width="380" height="170" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="840.0" y="571.92" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Action</text><text x="840.0" y="607.92" font-size="28" fill="#4B5563" text-anchor="middle">a tool call the software</text><text x="840.0" y="642.0799999999999" font-size="28" fill="#4B5563" text-anchor="middle">parses</text><rect x="50" y="515" width="380" height="170" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="3"/><text x="240.0" y="589.0" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">Observation</text><text x="240.0" y="625.0" font-size="28" fill="#4B5563" text-anchor="middle">result added to context</text><path d="M735,250 Q840,300 840,510" fill="none" stroke="#DB2777" stroke-width="5" marker-end="url(#ah0)"/><path d="M675,640 L410,640" fill="none" stroke="#DB2777" stroke-width="5" marker-end="url(#ah0)"/><path d="M240,510 Q240,300 345,250" fill="none" stroke="#DB2777" stroke-width="5" marker-end="url(#ah0)"/><rect x="1070" y="160" width="490" height="600" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="1080" y="215" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Thinking costs tokens</text><text x="1080" y="290" font-size="28" font-weight="700" fill="#4B5563" text-anchor="start">Fast answer</text><rect x="1080" y="305" width="40" height="50" rx="6" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="0"/><text x="1135" y="342" font-size="28" fill="#1F2937" text-anchor="start">~15 tokens</text><text x="1080" y="420" font-size="28" font-weight="700" fill="#4B5563" text-anchor="start">Careful answer (8×)</text><rect x="1080" y="435" width="320" height="50" rx="6" fill="#DB2777" stroke="#DB2777" stroke-width="0"/><text x="1415" y="472" font-size="28" fill="#1F2937" text-anchor="start">~120</text><text x="1080" y="560.0" font-size="28" font-weight="700" fill="#DB2777" text-anchor="start">'We decide which cases</text><text x="1080" y="594.16" font-size="28" font-weight="700" fill="#DB2777" text-anchor="start">deserve the slower answer.'</text><text x="560" y="820" font-size="30" fill="#1F2937" text-anchor="middle">The record shows what it did. The reasoning is only its own account.</text></svg>