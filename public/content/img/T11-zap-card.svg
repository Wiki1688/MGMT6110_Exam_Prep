<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="16" height="900" fill="#4F46E5"/><text x="60" y="78" font-size="44" font-weight="700" fill="#1F2937" text-anchor="start">The five-line agent card (PS5)</text><rect x="60" y="98" width="140" height="6" rx="3" fill="#4F46E5"/><rect x="60" y="140" width="1050" height="700" rx="18" fill="#FFFFFF" stroke="#4F46E5" stroke-width="4"/><rect x="60" y="140" width="1050" height="80" rx="18" fill="#4F46E5" stroke="#4F46E5" stroke-width="0"/><text x="90" y="192" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">My agent card | [NAME] | finished [DATE, TIME]</text><circle cx="120" cy="290" r="32" fill="#DBDAF9"/><text x="120" y="302" font-size="34" font-weight="700" fill="#4F46E5" text-anchor="middle">1</text><text x="180" y="285" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">The job</text><text x="180" y="325" font-size="28" fill="#4B5563" text-anchor="start">what it does, for whom (by role)</text><circle cx="120" cy="408" r="32" fill="#DBDAF9"/><text x="120" y="420" font-size="34" font-weight="700" fill="#4F46E5" text-anchor="middle">2</text><text x="180" y="403" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">The trigger</text><text x="180" y="443" font-size="28" fill="#4B5563" text-anchor="start">what starts a run</text><circle cx="120" cy="526" r="32" fill="#DBDAF9"/><text x="120" y="538" font-size="34" font-weight="700" fill="#4F46E5" text-anchor="middle">3</text><text x="180" y="521" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">The tools</text><text x="180" y="561" font-size="28" fill="#4B5563" text-anchor="start">each app and action it can use</text><circle cx="120" cy="644" r="32" fill="#DBDAF9"/><text x="120" y="656" font-size="34" font-weight="700" fill="#4F46E5" text-anchor="middle">4</text><text x="180" y="639" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">It must never</text><text x="180" y="679" font-size="28" fill="#4B5563" text-anchor="start">ONE thing + the setting that stops it</text><circle cx="120" cy="762" r="32" fill="#DBDAF9"/><text x="120" y="774" font-size="34" font-weight="700" fill="#4F46E5" text-anchor="middle">5</text><text x="180" y="757" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">Where a person checks</text><text x="180" y="797" font-size="28" fill="#4B5563" text-anchor="start">who reads the output, and when</text><rect x="1160" y="140" width="400" height="300" rx="18" fill="#FEF3C7" stroke="#CA8A04" stroke-width="3"/><text x="1360.0" y="241.6" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">Written BEFORE the</text><text x="1360.0" y="280.0" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">first run</text><text x="1360.0" y="316.0" font-size="28" fill="#4B5563" text-anchor="middle">the time stamp proves you</text><text x="1360.0" y="350.15999999999997" font-size="28" fill="#4B5563" text-anchor="middle">wrote the job first</text><rect x="1160" y="480" width="400" height="360" rx="18" fill="#E8E6FB" stroke="#4F46E5" stroke-width="3"/><text x="1360.0" y="611.6" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">A Zap = 1 trigger + 1</text><text x="1360.0" y="650.0" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">action</text><text x="1360.0" y="686.0" font-size="28" fill="#4B5563" text-anchor="middle">free plan · 3+ runs</text><text x="1360.0" y="720.16" font-size="28" fill="#4B5563" text-anchor="middle">checked in Zap history</text></svg>